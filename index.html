{% extends 'base.html' %}
{% block content %}
<div class="space-y-6">
	<div class="grid grid-cols-1 md:grid-cols-4 gap-4">
		<div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
			<p class="text-xs text-slate-400">Total Titik ATCS</p>
			<p class="text-2xl font-bold text-blue-400 mt-1">4 Kamera</p>
		</div>
		<div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
			<p class="text-xs text-slate-400">Status Sistem AI</p>
			<p class="text-xl font-bold text-emerald-400 mt-1">Aktif Memindai</p>
		</div>
		<div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
			<p class="text-xs text-slate-400">Kondisi Jalan</p>
			<p class="text-xl font-bold text-amber-400 mt-1" id="val-pothole-status">Monitoring...</p>
		</div>
		<div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
			<p class="text-xs text-slate-400">Waktu Server</p>
			<p class="text-xl font-bold text-slate-200 mt-1 font-mono" id="val-time">-</p>
		</div>
	</div>

	<div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
		<h3 class="font-bold text-sm mb-3">PETA WEB-GIS ATCS KOTA MAGELANG</h3>
		<div id="map" class="h-96 rounded-lg border border-slate-800"></div>
	</div>
</div>

<script>
	const map = L.map('map').setView([-7.4797, 110.2177], 13);
	L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

	L.marker([-7.4833, 110.2222]).addTo(map).bindPopup("<b>Simpang 4 Rejowinangun</b><br><a href='/detection' style='color:blue'>Buka Inspeksi Video</a>");
	L.marker([-7.4582, 110.2225]).addTo(map).bindPopup("<b>CCTV RSJ - Utara</b>");

	setInterval(() => {
		fetch('/api/telemetry')
			.then(r => r.json())
			.then(d => {
				document.getElementById('val-time').innerText = d.last_update;
				document.getElementById('val-pothole-status').innerText = d.pothole_detected ? "Ada Lubang Terdeteksi" : "Jalan Baik";
			});
	}, 1500);
</script>
{% endblock %}
