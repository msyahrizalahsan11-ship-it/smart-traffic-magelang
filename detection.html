{% extends 'base.html' %}
{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    
	<!-- Video Stream Panel (7 Kolom) -->
	<div class="lg:col-span-7 bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4">
		<div class="flex justify-between items-center">
			<h3 class="font-bold text-sm flex items-center gap-2">
				<span class="w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"></span>
				INSPEKSI VIDEO REAL-TIME & AI DETEKSI
			</h3>
			<span class="text-xs bg-blue-950 text-blue-400 border border-blue-800 px-2 py-0.5 rounded font-mono">LIVE AI ENGINE</span>
		</div>

		<div class="aspect-video bg-black rounded-lg overflow-hidden border border-slate-800 relative">
			<img src="/video_feed" class="w-full h-full object-cover">
		</div>

		<div class="grid grid-cols-2 gap-4 text-xs">
			<div class="p-3 bg-slate-950 rounded-lg border border-slate-800">
				<p class="text-slate-400">Kondisi Permukaan Jalan:</p>
				<p class="text-base font-bold text-emerald-400 mt-1" id="det-pothole">Memeriksa...</p>
			</div>
			<div class="p-3 bg-slate-950 rounded-lg border border-slate-800">
				<p class="text-slate-400">Parkir Liar / Hambatan:</p>
				<p class="text-base font-bold text-rose-400 mt-1" id="det-parking">0 Unit</p>
			</div>
		</div>
	</div>

	<!-- Panel Pengaturan Input Source (5 Kolom) -->
	<div class="lg:col-span-5 bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4">
		<h3 class="font-bold text-sm text-blue-400">⚙️ PENGATURAN INPUT VIDEO / CCTV</h3>
		<p class="text-xs text-slate-400">Ganti sumber video langsung dari web tanpa merubah kode Python.</p>

		<!-- Form 1: Pilih Preset CCTV -->
		<div class="p-3 bg-slate-950 rounded-lg border border-slate-800 space-y-2">
			<label class="text-xs font-semibold text-slate-300">1. Pilih Preset CCTV ATCS:</label>
			<select id="preset-select" class="w-full bg-slate-900 border border-slate-700 text-xs rounded p-2 text-slate-200">
				<option value="rejowinangun">Simpang 4 Rejowinangun (Live Stream)</option>
				<option value="rsj_utara">CCTV RSJ - Utara</option>
			</select>
			<button onclick="submitPreset()" class="w-full bg-blue-600 hover:bg-blue-500 text-xs py-1.5 rounded font-semibold text-white">Ganti CCTV Preset</button>
		</div>

		<!-- Form 2: Upload File Video Mandiri -->
		<div class="p-3 bg-slate-950 rounded-lg border border-slate-800 space-y-2">
			<label class="text-xs font-semibold text-slate-300">2. Unggah File Video (.mp4):</label>
			<input type="file" id="video-file-input" accept="video/*" class="w-full text-xs text-slate-400 file:bg-slate-800 file:border-0 file:rounded file:px-2 file:py-1 file:text-xs file:text-slate-200">
			<button onclick="submitFileUpload()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-xs py-1.5 rounded font-semibold text-white">Unggah & Diproses AI</button>
		</div>

		<!-- Form 3: Input Link Stream URL m3u8 -->
		<div class="p-3 bg-slate-950 rounded-lg border border-slate-800 space-y-2">
			<label class="text-xs font-semibold text-slate-300">3. Input Custom Stream URL (.m3u8 / RTSP):</label>
			<input type="text" id="custom-url-input" placeholder="http://domain.com/cctv.m3u8" class="w-full bg-slate-900 border border-slate-700 text-xs rounded p-2 text-slate-200">
			<button onclick="submitCustomUrl()" class="w-full bg-purple-600 hover:bg-purple-500 text-xs py-1.5 rounded font-semibold text-white">Hubungkan URL Baru</button>
		</div>
	</div>

</div>

<script>
	function submitPreset() {
		const id = document.getElementById('preset-select').value;
		const fd = new FormData();
		fd.append('source_type', 'preset');
		fd.append('cctv_id', id);
		sendConfig(fd);
	}

	function submitFileUpload() {
		const fileInput = document.getElementById('video-file-input');
		if(!fileInput.files[0]) return alert("Pilih file video terlebih dahulu!");
		const fd = new FormData();
		fd.append('source_type', 'file');
		fd.append('file', fileInput.files[0]);
		sendConfig(fd);
	}

	function submitCustomUrl() {
		const url = document.getElementById('custom-url-input').value;
		if(!url) return alert("Masukkan URL!");
		const fd = new FormData();
		fd.append('source_type', 'url');
		fd.append('custom_url', url);
		sendConfig(fd);
	}

	function sendConfig(formData) {
		fetch('/api/config/source', { method: 'POST', body: formData })
			.then(r => r.json())
			.then(d => alert(d.message))
			.catch(e => console.error(e));
	}

	setInterval(() => {
		fetch('/api/telemetry')
			.then(r => r.json())
			.then(d => {
				document.getElementById('det-pothole').innerText = d.pothole_detected ? "ADA LUBANG" : "JALAN MULUS";
				document.getElementById('det-parking').innerText = d.illegal_parking_count + " Unit (" + d.side_friction_status + ")";
				document.getElementById('header-location').innerText = "Source: " + d.location;
			});
	}, 1500);
</script>
{% endblock %}
